services:
  sync:
    build:
      context: .
      dockerfile: services/sync/Dockerfile
    environment:
      PORT: "8787"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://locus:locus@postgres:5432/locus_sync
      S3_ENDPOINT: http://objects:9000
      LOCUS_SYNC_BOOTSTRAP_TOKEN: local-development-device-token-change-before-use
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      objects:
        condition: service_started
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: locus_sync
      POSTGRES_USER: locus
      POSTGRES_PASSWORD: locus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locus -d locus_sync"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - locus-sync-postgres:/var/lib/postgresql/data
      - ./services/sync/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  objects:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: locus
      MINIO_ROOT_PASSWORD: locus-development-only
    volumes:
      - locus-sync-objects:/data

volumes:
  locus-sync-postgres:
  locus-sync-objects:
