name: Publish Canary

on:
  push:
    tags: ["v*-canary.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    environment: canary
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: locus-browser
      - uses: actions/checkout@v4
        with:
          repository: nahid-sparktales/locus-platform
          ref: ${{ vars.LOCUS_PLATFORM_REF }}
          path: locus-platform
      - name: Require immutable platform release
        env:
          LOCUS_PLATFORM_REF: ${{ vars.LOCUS_PLATFORM_REF }}
        run: |
          if [[ -z "$LOCUS_PLATFORM_REF" || "$LOCUS_PLATFORM_REF" == "main" ]]; then
            echo "LOCUS_PLATFORM_REF must be an immutable tag or commit"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: locus-browser/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/locus-browser.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/locus-browser.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Install locked dependencies
        working-directory: locus-browser
        run: pnpm install --frozen-lockfile
      - name: Build pinned platform contracts
        working-directory: locus-platform
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Verify production sync dependencies
        working-directory: locus-browser
        env:
          LOCUS_SYNC_URL: ${{ vars.LOCUS_SYNC_URL }}
        run: pnpm sync:verify-deployment
      - name: Verify source
        working-directory: locus-browser
        run: pnpm canary:check && pnpm typecheck && pnpm test && pnpm build && pnpm --filter @locus/browser-desktop compat:extensions && pnpm --filter @locus/browser-desktop acceptance:ui && pnpm audit --audit-level high
      - name: Prepare App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          echo "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize Apple Silicon canary
        working-directory: locus-browser
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          LOCUS_TARGET_ARCH: arm64
          LOCUS_HOST_PYTHON: python3
          LOCUS_EXTENSION_GALLERY_URL: ${{ vars.LOCUS_EXTENSION_GALLERY_URL }}
          LOCUS_SYNC_URL: ${{ vars.LOCUS_SYNC_URL }}
        run: pnpm dist:canary
      - name: Verify signed and notarized application
        working-directory: locus-browser
        run: |
          codesign --verify --deep --strict --verbose=2 "release/mac-arm64/Locus Browser.app"
          spctl --assess --type execute --verbose=4 "release/mac-arm64/Locus Browser.app"
          xcrun stapler validate "release/mac-arm64/Locus Browser.app"
      - name: Generate SBOM and signed release manifest
        working-directory: locus-browser
        env:
          LOCUS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.LOCUS_RELEASE_SIGNING_PRIVATE_KEY }}
        run: pnpm release:sbom && pnpm release:manifest -- --require-signature
      - name: Verify complete canary release gate
        working-directory: locus-browser
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          LOCUS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.LOCUS_RELEASE_SIGNING_PRIVATE_KEY }}
          LOCUS_EXTENSION_GALLERY_URL: ${{ vars.LOCUS_EXTENSION_GALLERY_URL }}
          LOCUS_SYNC_URL: ${{ vars.LOCUS_SYNC_URL }}
          LOCUS_PLATFORM_REF: ${{ vars.LOCUS_PLATFORM_REF }}
        run: pnpm canary:check -- --release
      - name: Publish immutable prerelease
        working-directory: locus-browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:publish
